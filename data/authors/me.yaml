experience:
  - role: Graduate Research Assistant
    org: Goswami Lab, Department of Animal Science and Center for Agricultural Data Analytics, University of Arkansas System Division of Agriculture
    start: 2025-07-01
    summary: |
      Conceived and built Cassette2Vec-EC, which reads the arrangement of genes
      inside genomic islands to classify poultry-associated *Enterococcus
      cecorum* (AUROC 0.918 under genome-grouped cross-validation, 0.694 with
      whole studies held out; *Frontiers in Microbiology*, 2026). Lead the
      computational work on a cross-cohort study of gut microbiome signatures
      in depression, reanalyzed a public beef cattle rumen multi-omics dataset
      (PRJNA448333), and serve as computational lead for growth-performance
      analysis in an Arkansas Biosciences Institute swine microbiome-immune
      study. Co-developed PDAC-EcoMap and collaborate with Argonne National
      Laboratory (Arctic soil microbiome) and the University of
      Nebraska-Lincoln (single-cell annotation of taste cells).
    tags:
      - Microbial genomics
      - Machine learning
      - Mendelian randomization
      - Microbiome
  - role: Bioinformatics Analyst
    org: Moffitt Cancer Center, Tampa, FL
    start: 2024-07-01
    end: 2025-06-30
    summary: |
      Rebuilt multi-omics workflows in Nextflow and Snakemake for genomic,
      transcriptomic, and LC-MS/MS metabolomic data, cutting runtime by about
      40 percent. Supported tumor ecosystem and spatial transcriptomics
      analyses for cancer research teams.
    tags:
      - Nextflow
      - Snakemake
      - Spatial transcriptomics
  - role: Graduate Research Intern
    org: University of South Florida, Tampa, FL
    start: 2023-07-01
    end: 2024-06-30
    summary: |
      Analyzed single-cell and spatial transcriptomics data (Seurat, Harmony)
      to characterize tumor microenvironments, and integrated metabolomics
      with transcriptomics to link metabolite levels to gene expression.
    tags:
      - Single-cell
      - Metabolomics

